name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check tag and source version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - name: Require reviewed version notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --check && cargo test --locked && cargo build --locked
      - run: python3 tests/native_command_pty.py target/debug/cx
      - run: CX_TEST_SHELL=/bin/sh python3 tests/native_command_pty.py target/debug/cx
      - run: sudo apt-get update && sudo apt-get install -y shellcheck fish zsh tmux poppler-utils python3-pyte openssh-server
      - name: Container integration fixtures
        run: |
          cargo build --locked
          docker pull ubuntu:24.04
          python3 tests/session_chooser_pty.py target/debug/cx
          python3 tests/containers_live.py target/debug/cx
          python3 tests/container_agents_live.py target/debug/cx
          npm install --prefix "$RUNNER_TEMP/cx-devcontainer-cli" @devcontainers/cli@0.89.0 --no-audit --no-fund
          PATH="$RUNNER_TEMP/cx-devcontainer-cli/node_modules/.bin:$PATH" python3 tests/devcontainer_cli_live.py target/debug/cx
      - run: python3 tests/mouse_scrollback_pty.py target/debug/cx
      - run: python3 tests/codex_wheel_pty.py target/debug/cx
      - run: python3 tests/codex_wheel_threads_pty.py target/debug/cx
      - run: python3 tests/clipboard_pty.py target/debug/cx
      - run: python3 tests/metadata_reconnect_cli.py target/debug/cx
      - run: python3 tests/jump_routes_cli.py target/debug/cx
      - run: python3 tests/access_routes_cli.py target/debug/cx
      - run: python3 tests/enrollment_tooling_cli.py target/debug/cx
      - run: python3 tests/robot_enrollment.py
      - run: python3 tests/login_terminal_pty.py target/debug/cx
      - run: python3 tests/attach_terminal_pty.py target/debug/cx
      - run: python3 tests/enrollment_auth_pty.py target/debug/cx
      - run: python3 tests/enrollment_ssh.py .
      - run: python3 tests/stop_shell_live.py target/debug/cx
      - run: python3 tests/session_permissions_live.py target/debug/cx
      - run: python3 tests/manual_agents_live.py target/debug/cx
      - run: python3 tests/session_names_live.py target/debug/cx
      - run: python3 tests/shell_labels_live.py target/debug/cx
      - run: python3 tests/tmux_discovery_live.py target/debug/cx
      - run: python3 tests/preview_helper_live.py target/debug/cx
      - run: python3 tests/source_preview_pty.py target/debug/cx
      - run: python3 tests/markdown_preview_pty.py target/debug/cx
      - run: python3 tests/markdown_blocks_pty.py target/debug/cx
      - run: python3 tests/markdown_prose_pty.py target/debug/cx
      - run: python3 tests/markdown_relative_pty.py target/debug/cx
      - run: python3 tests/preview_search_pty.py target/debug/cx
      - run: python3 tests/browser_find_pty.py target/debug/cx
      - run: python3 tests/list_wheel_pty.py target/debug/cx
      - run: python3 tests/pdf_pages_helper.py target/debug/cx
      - run: python3 tests/pdf_pages_pty.py target/debug/cx
      - run: CX_TEST_SHELL=/usr/bin/fish python3 tests/native_command_pty.py target/debug/cx
      - run: CX_TEST_SHELL=/usr/bin/zsh python3 tests/native_command_pty.py target/debug/cx
      - run: shellcheck install.sh tests/distro_smoke.sh scripts/build-portable-tmux.sh scripts/enroll-tmux.sh && python3 tests/install_fixture.py
  portable:
    uses: ./.github/workflows/portable.yml
  publish:
    needs: [checks, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries
      - name: Package and sign verified binaries
        env:
          CX_RELEASE_SIGNING_KEY: ${{ secrets.CX_RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CX_RELEASE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout > "$key.pub"
          cmp "$key.pub" release-key.pem
          rm "$key.pub"
          mkdir dist
          for arch in x86_64 aarch64; do
            binary="binaries/binary-$arch/cx"
            test -f "$binary" && test ! -L "$binary"
            chmod 755 "$binary"
            asset="dist/cx-$GITHUB_REF_NAME-linux-$arch.tar.gz"
            tar --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -C "binaries/binary-$arch" -czf "$asset" cx
            openssl dgst -sha256 -sign "$key" -out "$asset.sig" "$asset"
            openssl dgst -sha256 -verify release-key.pem -signature "$asset.sig" "$asset"
            tool="binaries/binary-$arch/tmux"
            test -f "$tool" && test ! -L "$tool"
            chmod 755 "$tool"
            asset="dist/cx-tmux-$GITHUB_REF_NAME-linux-$arch.tar.gz"
            tar --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -C "binaries/binary-$arch" -czf "$asset" tmux
            openssl dgst -sha256 -sign "$key" -out "$asset.sig" "$asset"
            openssl dgst -sha256 -verify release-key.pem -signature "$asset.sig" "$asset"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        id: attest
        with:
          subject-path: dist/*.tar.gz
      - name: Attach provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CX_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for asset in dist/*.tar.gz; do cp "$CX_BUNDLE" "$asset.intoto.jsonl"; done
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > published-state; then
            if [ "$(cat published-state)" = false ]; then
              echo 'Published release is immutable; retaining existing assets.'
              exit 0
            fi
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "cx $GITHUB_REF_NAME" --notes-file notes.md --draft
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file notes.md
