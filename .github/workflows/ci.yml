name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --check && cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y shellcheck tmux poppler-utils iproute2 iputils-ping ncurses-bin
      - run: shellcheck install.sh tests/distro_smoke.sh scripts/build-portable-tmux.sh scripts/enroll-tmux.sh
      - run: python3 tests/install_fixture.py
  portable:
    uses: ./.github/workflows/portable.yml
