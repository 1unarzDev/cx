name: portable binaries
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add '${{ matrix.target }}'
      - run: cargo test --locked && cargo build --release --locked --target '${{ matrix.target }}'
      - name: Verify static binary
        run: |
          binary='target/${{ matrix.target }}/release/cx'
          "$binary" --version
          if readelf -l "$binary" | grep -q 'INTERP'; then echo 'dynamic executable refused' >&2; exit 1; fi
          mkdir dist
          cp "$binary" dist/cx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/cx
          retention-days: 7
          if-no-files-found: error
  distro:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-${{ matrix.arch }}
          path: dist
      - run: chmod +x dist/cx && tests/distro_smoke.sh dist/cx
