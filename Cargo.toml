[package]
name = "cx"
version = "0.1.42"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/1unarzDev/cx"

[dependencies]
syntect = { version = "=5.3.0", default-features = false, features = ["default-themes", "regex-fancy", "parsing"] }
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-fancy"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "=8.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
signal-hook = "0.3"
tar = "0.4"
flate2 = "1"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[dev-dependencies]
tempfile = "3"
