# cx owns this isolated server; never loaded into a personal tmux server.
set -g prefix C-]
unbind C-b
bind C-] send-prefix
bind Space detach-client
bind ? display-popup -w 62 -h 10 -E "sh -c 'printf \"\\n  cx session shortcuts\\n\\n  Ctrl+] then Space   Return to cx (work keeps running)\\n  Ctrl+] then ?       Show these shortcuts\\n  Ctrl+] twice        Send a literal Ctrl+]\\n\\n  Native app owns Ctrl+C, Ctrl+B, Escape and Tab.\\n  Press Enter to close.\"; read -r reply'"
set -g status on
set -g status-style default
set -g status-left '#[fg=cyan,bold] cx #[default] Return to cx: Ctrl+] Space '
set -g status-left-length 32
set -g status-right-length 55
set -g exit-empty off
set -g history-limit 2000
set -g default-terminal 'screen-256color'
set -g allow-rename off
set -g set-titles off
