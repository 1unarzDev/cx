# cx owns this isolated server; never loaded into a personal tmux server.
set -g prefix C-]
unbind C-b
bind C-] send-prefix
bind Space detach-client
bind ? display-message 'cx: Ctrl+] Space returns; Ctrl+] Ctrl+] sends literal prefix; Ctrl+] ? help'
set -g status on
set -g status-style default
set -g status-left ' cx | '
set -g status-left-length 12
set -g status-right-length 100
set -g exit-empty off
set -g history-limit 2000
set -g default-terminal 'screen-256color'
set -g allow-rename off
set -g set-titles off
