# cx owns this isolated server; never loaded into a personal tmux server.
# Parse cx's quoted launcher consistently; it explicitly execs the user's shell.
set -g default-shell '/bin/sh'
# A single explicit workspace-return key; native editing keys stay native.
set -g prefix None
unbind C-b
bind-key -n C-] detach-client
set -g status on
set -g status-style default
set -g status-left '#[fg=cyan,bold] cx #[default] #{?pane_in_mode,Scroll: y copy / Esc,Return: Ctrl+]} '
set -g status-left-length 32
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right-length 55
set -g exit-empty off
set -g history-limit 2000
# Request wheel events instead of emulator alternate-screen Up/Down synthesis.
# Forward only when the application requested mouse input; alternate-screen
# applications without mouse support must not receive synthetic history arrows.
# Forward application yanks and tmux selections to the viewing terminal (OSC 52).
# No generic escape passthrough, display socket, or automatic clipboard reads.
set -s set-clipboard on
set -su terminal-overrides
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
set -g mouse on
bind-key -n WheelUpPane if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e -t = ; send-keys -X -t = scroll-up'
bind-key -n WheelDownPane if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M'
# Selecting transcript text copies on release; y/Enter copy keyboard selections.
bind-key -T copy-mode Space send-keys -X begin-selection
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
# Modern tmux terminfo keeps italics distinct from reverse video.
# The binary checks terminfo availability before loading this owned config.
set -g default-terminal 'tmux-256color'
set -g allow-rename off
set -g set-titles off

# Default-background cells follow each viewing terminal, including its opacity.
set -g window-style "fg=terminal,bg=terminal"
set -g window-active-style "fg=terminal,bg=terminal"
