name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --check && cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y shellcheck tmux python3-pyte poppler-utils iproute2 iputils-ping ncurses-bin
      - run: shellcheck install.sh tests/distro_smoke.sh scripts/build-portable-tmux.sh scripts/enroll-tmux.sh
      - name: Container integration fixtures
        run: |
          cargo build --locked
          docker pull ubuntu:24.04
          python3 tests/session_chooser_pty.py target/debug/cx
          python3 tests/transfer_enter_pty.py target/debug/cx
          python3 tests/containers_live.py target/debug/cx
          python3 tests/container_agents_live.py target/debug/cx
          npm install --prefix "$RUNNER_TEMP/cx-devcontainer-cli" @devcontainers/cli@0.89.0 --no-audit --no-fund
          PATH="$RUNNER_TEMP/cx-devcontainer-cli/node_modules/.bin:$PATH" python3 tests/devcontainer_cli_live.py target/debug/cx
      - run: python3 tests/install_fixture.py
  portable:
    uses: ./.github/workflows/portable.yml
