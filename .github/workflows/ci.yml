name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --check && cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y shellcheck fish zsh tmux sqlite3 python3-pyte python3-pil poppler-utils openssh-server iproute2 iputils-ping ncurses-bin
      - run: shellcheck install.sh tests/run_regressions.sh tests/distro_smoke.sh scripts/build-portable-tmux.sh scripts/enroll-tmux.sh scripts/build-portable-reptyr.sh scripts/enable-ptrace.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0 # node:sqlite, for the mesh Worker's in-memory D1
      - name: Regression fixtures (tests/run_regressions.sh is the one list; any SKIP fails CI)
        run: |
          docker pull ubuntu:24.04
          tests/run_regressions.sh --no-rust --with-ssh --with-docker | tee "$RUNNER_TEMP/regressions.log"
          ! grep '^SKIP' "$RUNNER_TEMP/regressions.log"
      - name: Fixture variants outside the list
        run: |
          CX_TEST_SHELL=/usr/bin/zsh python3 tests/native_command_pty.py target/debug/cx
          CX_TEST_SHELL=/usr/bin/fish python3 tests/folder_command_ui_pty.py target/debug/cx /usr/bin/fish
          npm install --prefix "$RUNNER_TEMP/cx-devcontainer-cli" @devcontainers/cli@0.89.0 --no-audit --no-fund
          PATH="$RUNNER_TEMP/cx-devcontainer-cli/node_modules/.bin:$PATH" python3 tests/devcontainer_cli_live.py target/debug/cx
  portable:
    uses: ./.github/workflows/portable.yml
