name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          tar -C target/release -czf dist/cx-linux-x86_64.tar.gz cx
          cd dist
          sha256sum cx-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cx-linux-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
