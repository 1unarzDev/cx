name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --check && cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y shellcheck tmux sqlite3 python3-pyte poppler-utils openssh-server iproute2 iputils-ping ncurses-bin
      - run: shellcheck install.sh tests/distro_smoke.sh scripts/build-portable-tmux.sh scripts/enroll-tmux.sh scripts/build-portable-reptyr.sh scripts/enable-ptrace.sh
      - name: Container integration fixtures
        run: |
          cargo build --locked
          docker pull ubuntu:24.04
          python3 tests/session_chooser_pty.py target/debug/cx
          python3 tests/startup_directory_pty.py target/debug/cx
          python3 tests/terminal_startup_loader_pty.py target/debug/cx
          python3 tests/terminal_startup_readiness_live.py target/debug/cx
          python3 tests/session_runtime_live.py target/debug/cx
          python3 tests/container_discovery_fixtures.py target/debug/cx
          python3 tests/container_session_reconcile_live.py target/debug/cx
          python3 tests/session_activity_timestamp_live.py target/debug/cx
          python3 tests/native_runtime_metadata_live.py target/debug/cx
          python3 tests/codex_process_mode_live.py target/debug/cx
          python3 tests/transfer_enter_pty.py target/debug/cx
          python3 tests/containers_live.py target/debug/cx
          python3 tests/container_agents_live.py target/debug/cx
          python3 tests/devcontainer_terminal_recovery_live.py target/debug/cx
          python3 tests/claude_contrast_live.py target/debug/cx
          npm install --prefix "$RUNNER_TEMP/cx-devcontainer-cli" @devcontainers/cli@0.89.0 --no-audit --no-fund
          PATH="$RUNNER_TEMP/cx-devcontainer-cli/node_modules/.bin:$PATH" python3 tests/devcontainer_cli_live.py target/debug/cx
      - name: Session adoption fixtures
        run: |
          CX_REPTYR_DYNAMIC=1 sh scripts/build-portable-reptyr.sh "$RUNNER_TEMP/cx-reptyr"
          sudo setcap cap_sys_ptrace+ep "$RUNNER_TEMP/cx-reptyr"
          export CX_ADOPT_CAPABLE=1 CX_ADOPT_REPTYR="$RUNNER_TEMP/cx-reptyr"
          python3 tests/adopt_terminal_live.py target/debug/cx
          python3 tests/adopt_stress_live.py target/debug/cx 30
      - run: python3 tests/install_fixture.py
      - run: python3 tests/session_names_live.py target/debug/cx
      - run: python3 tests/peer_pairing_cli.py target/debug/cx
      - run: python3 tests/peer_mesh_cli.py target/debug/cx
      - run: python3 tests/peer_managed_ssh.py target/debug/cx
      - run: python3 tests/device_policy_cli.py target/debug/cx
  portable:
    uses: ./.github/workflows/portable.yml
